name: Petra Cron Jobs

# GitHub runs scheduled workflows "best effort": in practice this workflow started
# only every 40-120 minutes (Oct 2026), and each run used to do only the jobs of the
# schedule that fired — so reminders were sent 1-3 hours late. Every run now does
# all the frequent work (the endpoints are idempotent: a scheduled message is claimed
# before it is sent, see src/lib/scheduled-message-claim.ts). The primary 5-minute
# trigger for send-reminders is Supabase pg_cron (prisma/cron_send_reminders.sql);
# this workflow is the fallback.
on:
  schedule:
    - cron: "*/5 * * * *"
    # Daily at 06:00 UTC — student engagement (new lessons + stalled nudges)
    - cron: "0 6 * * *"
  workflow_dispatch:

# Never two runs at once (a delayed run can land on top of the next one)
concurrency:
  group: petra-cron
  cancel-in-progress: false

jobs:
  send-reminders:
    name: Send WhatsApp Reminders
    runs-on: ubuntu-latest
    if: github.event.schedule != '0 6 * * *'
    steps:
      - name: Call send-reminders endpoint
        run: |
          curl -s -X GET \
            "https://petra-app.com/api/cron/send-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 30 \
            -w "\nHTTP %{http_code}"

  online-class-reminders:
    name: Send Online Class Reminders
    runs-on: ubuntu-latest
    if: github.event.schedule != '0 6 * * *'
    steps:
      - name: Call online-class-reminders endpoint
        run: |
          curl -s -X GET \
            "https://petra-app.com/api/cron/online-class-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 30 \
            -w "\nHTTP %{http_code}"

  online-classes-engagement:
    name: Send Online Classes Engagement Notifications
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 6 * * *'
    steps:
      - name: Call online-classes-engagement endpoint
        run: |
          curl -s -X GET \
            "https://petra-app.com/api/cron/online-classes-engagement" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 30 \
            -w "\nHTTP %{http_code}"

  alldog-call-retry:
    name: Retry AllDog Answered-Call Summaries
    runs-on: ubuntu-latest
    if: github.event.schedule != '0 6 * * *'
    steps:
      - name: Call alldog-call-retry endpoint
        run: |
          curl -s -X GET \
            "https://petra-app.com/api/cron/alldog-call-retry" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 60 \
            -w "\nHTTP %{http_code}"

  process-gcal-jobs:
    name: Process Google Calendar Sync Jobs
    runs-on: ubuntu-latest
    if: github.event.schedule != '0 6 * * *'
    steps:
      - name: Call process-jobs endpoint
        run: |
          curl -s -X GET \
            "https://petra-app.com/api/integrations/google/process-jobs" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 30 \
            -w "\nHTTP %{http_code}"

  process-invoice-jobs:
    name: Process Failed Invoice Jobs
    runs-on: ubuntu-latest
    if: github.event.schedule != '0 6 * * *'
    steps:
      - name: Call invoice process-jobs endpoint
        run: |
          curl -s -X POST \
            "https://petra-app.com/api/invoicing/process-jobs" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 30 \
            -w "\nHTTP %{http_code}"
